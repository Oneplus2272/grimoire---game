<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Кибер-Кот RPG</title>
  <link rel="stylesheet" href="style.css?v=15">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="battle-bg" class="battle-background hidden"></div>

  <div class="app">
    <!-- Шапка -->
    <header class="top-bar">
      <h1>Монеты: <span id="coins">0</span></h1>
      <p class="income-text">В секунду: <span id="income">0</span></p>
    </header>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <main class="main-content" id="screen-game">
      <button id="goToBattleBtn" class="battle-btn">
        <img src="./public/icon_battle.png" alt="Бой" class="battle-icon">
        В Бой
      </button>
      
      <!-- Кот увеличен, клик отключен (стиль cursor: default) -->
      <div class="pet-container">
        <img src="./public/pet.png" id="petImage" alt="Кибер-Кот" class="pet-img">
      </div>
    </main>

    <!-- ЭКРАН БОЯ -->
    <main class="main-content hidden" id="screen-battle">
      <div class="battle-arena">
        <!-- Враг -->
        <div class="enemy-container">
          <p class="enemy-name">Крыса-мутант</p>
          <div class="health-bar-bg">
            <div class="health-bar-fill" id="enemyHpBar" style="width: 100%;"></div>
          </div>
          <p id="enemyHpText" class="hp-text">HP: 100/100</p> <!-- Добавили текст HP -->
          <div class="relative-wrapper">
            <img src="./public/enemy1.png" id="enemyImage" alt="Враг" class="enemy-img">
            <div id="enemy-damage-container" class="damage-container"></div>
          </div>
        </div>

        <!-- Игрок -->
        <div class="player-container">
          <div class="relative-wrapper">
            <img src="./public/pet.png" id="battlePetImage" alt="Кот" class="battle-pet-img">
            <div id="player-damage-container" class="damage-container"></div>
          </div>
          <div class="health-bar-bg">
            <div class="health-bar-fill player-hp" id="playerHpBar" style="width: 100%;"></div>
          </div>
          <p id="playerHpText" class="hp-text">HP: 100/100</p>
        </div>
      </div>
    </main>

    <!-- ЭКРАН МАГАЗИНА -->
    <main class="main-content hidden" id="screen-shop">
      <div class="shop-item">
        <div class="shop-info">
          <h3>Кибер-коготь</h3>
          <p>+5 к урону</p>
        </div>
        <button id="buyPowerBtn" class="buy-btn">50 🪙</button>
      </div>
      <div class="shop-item">
        <div class="shop-info">
          <h3>Броня</h3>
          <p>+10 к макс. HP</p>
        </div>
        <button id="buyHpBtn" class="buy-btn">100 🪙</button>
      </div>
      <div class="shop-item">
        <div class="shop-info">
          <h3>Кибер-имплант</h3>
          <p>+1 монета в секунду</p>
        </div>
        <button id="buyAutoBtn" class="buy-btn">150 🪙</button>
      </div>
    </main>

    <!-- ЭКРАН РЕЙТИНГА -->
    <main class="main-content hidden" id="screen-rating">
      <div class="rating-card">
        <p>Текущий баланс:</p>
        <h3><span id="currentCoins">0</span> 🪙</h3>
      </div>
      <div class="rating-card">
        <p>Твой рекорд:</p>
        <h3><span id="highScore">0</span> 🪙</h3>
      </div>
      <button id="shareBtn" class="share-btn">📣 Похвастаться</button>
      <button id="resetBtn" class="reset-btn">🗑 Сбросить прогресс</button>
    </main>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <nav class="bottom-nav">
      <button id="navGameBtn" class="nav-btn active">
        <img src="./public/pet.png" alt="Питомец" class="nav-icon" style="border-radius:50%;">
        <span>Питомец</span>
      </button>
      <button id="navShopBtn" class="nav-btn">
        <img src="./public/icon_shop.png" alt="Магазин" class="nav-icon">
        <span>Магазин</span>
      </button>
      <button id="navRatingBtn" class="nav-btn">
        <img src="./public/icon_rating.png" alt="Рейтинг" class="nav-icon">
        <span>Рейтинг</span>
      </button>
    </nav>
  </div>
  
  <script src="game.js?v=15"></script>
</body>
</html>
