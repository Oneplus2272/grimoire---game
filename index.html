<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grimoire: Duel of Souls</title>
    <style>
        /* Сброс стилей для мобилок */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            background-color: #0d0614;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            /* ТУТ ФОН: обращаем внимание на .png */
            background-image: url('background.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Верхняя панель (Профиль и Ресурсы) */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            z-index: 10;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(30, 15, 50, 0.8);
            padding: 4px 12px 4px 4px;
            border-radius: 20px;
            border: 1px solid #5a2c8a;
        }

        .avatar {
            width: 30px;
            height: 30px;
            background-color: #444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .resources {
            display: flex;
            gap: 12px;
            font-size: 14px;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 6px 12px;
            border-radius: 20px;
        }

        /* Центральная часть с картами */
        .cards-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
            padding: 20px;
            margin-top: 50px; 
        }

        .card {
            width: 90px;
            height: 130px;
            background-color: #222;
            border-radius: 10px;
            border: 2px solid #ff4500;
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
            /* ТУТ КАРТА: обращаем внимание на .png */
            background-image: url('card_fire.png'); 
            background-size: cover;
            background-position: center;
        }

        .card:active {
            transform: scale(0.95);
        }

        /* Нижняя панель с кнопкой */
        .bottom-bar {
            padding: 20px;
            display: flex;
            justify-content: center;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
        }

        .attack-button {
            background: linear-gradient(180deg, #ff4c4c 0%, #aa0000 100%);
            color: white;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            padding: 15px 50px;
            border: 2px solid #ffcc00;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5), inset 0 2px 0 rgba(255,255,255,0.3);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            transition: all 0.1s;
        }

        .attack-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Верхняя панель -->
        <div class="top-bar">
            <div class="profile">
                <div class="avatar">👤</div>
                <span>Архимаг</span>
            </div>
            <div class="resources">
                <span>🪙 1000</span>
                <span>💜 500</span>
                <span>💎 10</span>
            </div>
        </div>

        <!-- Твоя колода -->
        <div class="cards-area">
            <div class="card" onclick="alert('Это Огненный Демон! Урон: 8, HP: 15')"></div>
        </div>

        <!-- Кнопка атаки -->
        <div class="bottom-bar">
            <button class="attack-button" onclick="startBattle()">ATTACK</button>
        </div>
    </div>

    <script>
        function startBattle() {
            alert('Поиск противника в сети... (Боевая система в разработке)');
        }
    </script>
</body>
</html>
