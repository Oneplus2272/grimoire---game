<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grimoire Game</title>
    
    <!-- Подключаем наш скрипт для Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Подключаем наши стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        
        <!-- Верхняя панель -->
        <div class="top-bar">
            <div class="profile">
                <div class="avatar">👤</div>
                <span>Архимаг</span>
            </div>
            <div class="resources">
                <span>🪙 1000</span>
                <span>💜 500</span>
                <span>💎 10</span>
            </div>
        </div>

        <!-- Колода -->
        <div class="cards-area">
            <div class="card card-fire" onclick="showCardInfo()"></div>
        </div>

        <!-- Кнопка -->
        <div class="bottom-bar">
            <button class="attack-button" onclick="startBattle()">ATTACK</button>
        </div>

    </div>

    <!-- Подключаем нашу логику -->
    <script src="game.js"></script>
</body>
</html>
