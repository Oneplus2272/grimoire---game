<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Кибер-Кот RPG</title>
  <link rel="stylesheet" href="style.css?v=14">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <!-- ФОН ЛОКАЦИИ (только для боя, управляется через CSS класс) -->
  <div id="battle-bg" class="battle-background hidden"></div>

  <div class="app">
    <!-- Шапка с монетами -->
    <header class="top-bar">
      <h1>Монеты: <span id="coins">0</span></h1>
      <p class="income-text">В секунду: <span id="income">0</span></p>
    </header>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <main class="main-content" id="screen-game">
      
      <!-- Боковые иконки -->
      <div class="side-icons">
        <img src="./public/icon_shop.png" id="openShopBtn" alt="Магазин" class="side-icon">
        <img src="./public/icon_rating.png" id="openRatingBtn" alt="Рейтинг" class="side-icon">
      </div>

      <!-- Кнопка В Бой -->
      <div class="battle-btn-container">
        <img src="./public/icon_battle.png" id="goToBattleBtn" alt="В Бой" class="battle-icon-btn">
        <span class="battle-text">В Бой</span>
      </div>

      <!-- Кот -->
      <div class="pet-container" id="petContainer">
        <img src="./public/pet.png" id="petImage" alt="Кибер-Кот" class="pet-img">
        <div id="floating-numbers"></div>
      </div>
    </main>

    <!-- ЭКРАН БОЯ -->
    <main class="main-content hidden" id="screen-battle" style="z-index: 5; position: relative;">
      <div class="battle-arena">
        <div class="enemy-container">
          <p class="enemy-name">Крыса-мутант</p>
          <div class="health-bar-bg">
            <div class="health-bar-fill" id="enemyHpBar" style="width: 100%;"></div>
          </div>
          <img src="./public/enemy1.png" id="enemyImage" alt="Враг" class="enemy-img">
        </div>

        <div class="player-container">
          <img src="./public/pet.png" alt="Кот" class="battle-pet-img">
          <div class="health-bar-bg">
            <div class="health-bar-fill player-hp" id="playerHpBar" style="width: 100%;"></div>
          </div>
          <p id="playerHpText">HP: 100/100</p>
        </div>
      </div>
      
      <!-- Кнопка отступить (используем иконку назад) -->
      <button id="backToGameBtn" class="back-icon-btn">
        <img src="./public/icon_back.png" alt="Назад" class="back-icon">
      </button>
    </main>

    <!-- ОВЕРЛЕЙ: МАГАЗИН -->
    <div class="overlay hidden" id="overlay-shop">
      <div class="overlay-content">
        <button class="close-overlay-btn" id="closeShopBtn">✕</button>
        <h2>Магазин</h2>
        <div class="shop-item">
          <div class="shop-info">
            <h3>Кибер-коготь</h3>
            <p>+5 к урону</p>
          </div>
          <button id="buyPowerBtn" class="buy-btn">50 🪙</button>
        </div>
        <div class="shop-item">
          <div class="shop-info">
            <h3>Броня</h3>
            <p>+10 к макс. HP</p>
          </div>
          <button id="buyHpBtn" class="buy-btn">100 🪙</button>
        </div>
        <div class="shop-item">
          <div class="shop-info">
            <h3>Кибер-имплант</h3>
            <p>+1 монета в секунду</p>
          </div>
          <button id="buyAutoBtn" class="buy-btn">150 🪙</button>
        </div>
      </div>
    </div>

    <!-- ОВЕРЛЕЙ: РЕЙТИНГ -->
    <div class="overlay hidden" id="overlay-rating">
      <div class="overlay-content">
        <button class="close-overlay-btn" id="closeRatingBtn">✕</button>
        <h2>Рейтинг</h2>
        <div class="rating-card">
          <p>Текущий баланс:</p>
          <h3><span id="currentCoins">0</span> 🪙</h3>
        </div>
        <div class="rating-card">
          <p>Твой рекорд:</p>
          <h3><span id="highScore">0</span> 🪙</h3>
        </div>
        <button id="shareBtn" class="share-btn">📣 Похвастаться</button>
        <button id="resetBtn" class="reset-btn">🗑 Сбросить прогресс</button>
      </div>
    </div>

  </div>
  
  <script src="game.js?v=14"></script>
</body>
</html>
