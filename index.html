<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Мой Питомец</title>
  <link rel="stylesheet" href="style.css?v=9">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <!-- Шапка с монетами -->
    <header class="top-bar">
      <h1>Монеты: <span id="coins">0</span></h1>
      <p class="income-text">В секунду: <span id="income">0</span></p>
    </header>

    <!-- ЭКРАН 1: Игра -->
    <main class="main-content" id="screen-game">
      <div class="pet-container" id="petContainer">
        <img src="./public/pet.png" id="petImage" alt="Кибер-Кот" class="pet-img">
        <!-- Контейнер для всплывающих цифр -->
        <div id="floating-numbers"></div>
      </div>
      <button id="tapBtn">Тапнуть</button>
    </main>

    <!-- ЭКРАН 2: Магазин -->
    <main class="main-content hidden" id="screen-shop">
      <!-- Переключатель режима покупки -->
      <div class="buy-mode-toggle">
        <button id="buyModeX1" class="mode-btn active">x1</button>
        <button id="buyModeMax" class="mode-btn">MAX</button>
      </div>

      <div class="shop-item">
        <div class="shop-info">
          <h3>Мощный палец</h3>
          <p>+1 к клику</p>
        </div>
        <button id="buyPowerBtn" class="buy-btn">50 🪙</button>
      </div>
      <p id="powerLevel" class="stats">Сила клика: 1</p>

      <div class="shop-item" style="margin-top: 20px;">
        <div class="shop-info">
          <h3>Кибер-имплант</h3>
          <p>+1 монета в секунду</p>
        </div>
        <button id="buyAutoBtn" class="buy-btn">100 🪙</button>
      </div>
      <p id="autoLevel" class="stats">Автоклик: 0/сек</p>
    </main>

    <!-- ЭКРАН 3: Рейтинг -->
    <main class="main-content hidden" id="screen-rating">
      <h2>🏆 Твой рейтинг</h2>
      <div class="rating-card">
        <p>Текущий баланс:</p>
        <h3><span id="currentCoins">0</span> 🪙</h3>
      </div>
      
      <div class="rating-card">
        <p>Твой рекорд:</p>
        <h3><span id="highScore">0</span> 🪙</h3>
      </div>

      <button id="shareBtn" class="share-btn">📣 Похвастаться друзьям</button>
      <button id="resetBtn" class="reset-btn">🗑 Сбросить прогресс</button>
    </main>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <nav class="bottom-nav">
      <button id="navGameBtn" class="nav-btn active">🎮 Играть</button>
      <button id="navShopBtn" class="nav-btn">🛒 Магазин</button>
      <button id="navRatingBtn" class="nav-btn">🏆 Рейтинг</button>
    </nav>
  </div>
  
  <script src="game.js?v=9"></script>
</body>
</html>
