<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grimoire Game</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ЭКРАН РУЛЕТКИ -->
    <div id="roulette-screen" class="screen active">
        <h1 class="title">Твой стартовый подарок!</h1>
        <div class="roulette-container">
            <img id="roulette-image" src="public/legend_fire.png" alt="Card">
        </div>
        <button id="spin-button" class="spin-btn" onclick="spinRoulette()">КРУТИТЬ</button>
        <button id="claim-button" class="claim-btn hidden" onclick="claimCard()">ЗАБРАТЬ</button>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН ИГРЫ -->
    <div id="main-screen" class="screen hidden">
        <div class="game-container">
            <div class="top-bar">
                <div class="profile">
                    <div class="avatar">👤</div>
                    <span>Архимаг</span>
                </div>
                <div class="resources">
                    <span>🪙 1000</span>
                    <span>💜 500</span>
                    <span>💎 10</span>
                </div>
            </div>

            <div class="cards-area">
                <img id="player-card" class="card" src="" alt="My Card">
            </div>

            <div class="bottom-bar">
                <button class="attack-button" onclick="startBattle()">ATTACK</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
